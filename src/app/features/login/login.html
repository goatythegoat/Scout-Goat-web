<div class="login-container">
  <div class="login-window">
    <div class="section-header">User Authentication</div>
    <div class="section-content">
      <form class="login-form" (ngSubmit)="onLogin()" novalidate>
        <div class="field-row">
          <label for="username">Username:</label><input type="text" id="username" name="username"[(ngModel)]="username" autocomplete="username" />
        </div>
        <div class="field-row"><label for="password">Password:</label><input type="password" id="password"
            name="password" [(ngModel)]="password" autocomplete="current-password" /></div>
        <div class="button-panel">
          <button type="submit" class="system-button">Accept</button>
          <button type="button" class="system-button" (click)="onCancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

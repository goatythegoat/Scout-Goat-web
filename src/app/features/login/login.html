<body>
<div class="login-window">
 <div class="section-header">Log In</div>
 <div class="section-content">
 <form class="form">
 <div class="field-row">
 <label for="user">User:</label>
 <input type="text" id="user" autocomplete="off" />
 </div>
 <div class="field-row">
 <label for="password">Password:</label>
 <input type="password" id="password" />
 </div>
 <div class="button-panel">
 <button type="button" class="system-button">Accept</button>
 <button type="button" class="system-button">Cancel</button>
 </div>
 </form>
 </div>
</div>
</body>
